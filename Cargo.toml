[package]
name = "bundle-test-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bundlesvr"

[dependencies]
tonic = { version = "0.12" }
prost = "0.13.5"
prost-types = "0.13.5"
log = "0.4.22"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "fs"] }
tokio-stream = "0.1"
futures = "0.3.30"
chrono = "0.4.38"
futures-util = "0.3.31"
env_logger = "0.11.5"
rand = "0.9.1"
bincode = "1.3.3"
uuid = { version = "1.17.0", features = ["v4", "fast-rng"] }

solana-sdk = "=2.2"
solana-client = "=2.2"
solana-system-interface = "1.0.0"
spl-memo = "6.0.0"

clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"
protobuf-src = "2.1.0"
